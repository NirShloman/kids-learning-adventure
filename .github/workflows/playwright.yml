name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      E2E_PREVIEW: '1'
      E2E_BASE_URL: http://127.0.0.1:4179
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci && npm ci --prefix functions
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Typecheck and unit tests
      if: matrix.shard == 1
      run: npm run typecheck && npm run test:unit && npm run test:integration
    - name: Build the release tested by every browser
      run: npm run build:release
    - name: Desktop and mobile smoke tests
      if: matrix.shard == 1
      run: npm run test:e2e:smoke
      env:
        PLAYWRIGHT_OUTPUT_DIR: qa-results/smoke
        PLAYWRIGHT_HTML_OUTPUT_DIR: qa-reports/smoke
        PLAYWRIGHT_JSON_OUTPUT_NAME: qa-reports/smoke.json
    - name: Run full Playwright matrix
      run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      env:
        PLAYWRIGHT_OUTPUT_DIR: qa-results/matrix
        PLAYWRIGHT_HTML_OUTPUT_DIR: qa-reports/matrix
        PLAYWRIGHT_JSON_OUTPUT_NAME: qa-reports/matrix.json
    - name: Measure active-scene response in browser simulation
      if: matrix.shard == 1
      run: npm run test:adventure:performance
      env:
        PLAYWRIGHT_OUTPUT_DIR: qa-results/performance
        PLAYWRIGHT_HTML_OUTPUT_DIR: qa-reports/performance
        PLAYWRIGHT_JSON_OUTPUT_NAME: qa-reports/performance.json
    - name: Verify prepared worlds without network
      if: matrix.shard == 1
      run: npm run test:adventure:offline
      env:
        PLAYWRIGHT_OUTPUT_DIR: qa-results/offline
        PLAYWRIGHT_HTML_OUTPUT_DIR: qa-reports/offline
        PLAYWRIGHT_JSON_OUTPUT_NAME: qa-reports/offline.json
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.shard }}
        path: |
          qa-reports/
          qa-results/
        retention-days: 30
