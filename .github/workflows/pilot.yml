name: Kindergarten pilot
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: pilot-functions
      - run: npx playwright install --with-deps chrome firefox msedge
      - run: npm run typecheck && npm run validate:privacy && npm run test:unit && npm run test:integration
      - run: npm run build
        working-directory: pilot-functions
      - name: Rules, callables and desktop pilot against emulators
        run: node pilot-functions/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --config firebase.pilot.json --project demo-olamia-pilot --only auth,firestore,functions "node --import tsx --test pilot-functions/tests/emulator.test.mts && node scripts/pilot-browser-tests.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindergarten-pilot-qa
          path: |
            qa-reports/pilot.json
            qa-results/pilot/
          retention-days: 14
